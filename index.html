<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Meta tag</title>

    <meta name="description" content="เว็บไซต์แนะนำร้านกาแฟนานั่ง คาเฟ่บรรยากาศดีในกรุงเทพ พร้อมรีวิวและพิกัด">
    <!-- <meta name="description"> : คำอธิบายสั้น ๆ (ปรากฏใต้ชื่อเว็บใน Google) -->

    <meta name="keywords" content="ร้านกาแฟ, คาเฟ่กรุงเทพ, coffe shop">
    <!-- <meta name="keywords"> : คีย์เวิร์ด (ปัจจุบัน Google ไม่ใช้แล้ว แต่บาง Search Engine เล็ก ๆ ยังดูอยู่) -->

    <meta name="robots" content="index, follow">
    <!-- Robots (บอกว่าเพจนี้ให้ Google เก็บข้อมูลหรือไม่) -->
</head>

<body>

    <h1>10 ร้านกาแฟน่านั่งในกรุงเทพ</h1>
    <p>เว็บไซต์นี้รวบรวมร้านกาแฟบรรยากาศดี เหมาะกับการนั่งทำงาน พูดคุย หรือพักผ่อนในกรุงเทพ</p>

    <h2>1. ค่าเฟ่ย่านอารีย์</h2>
    <p>บรรยากาศสบาย เครื่องดื่มรสชาติดี ใกล้รถไฟฟ้า</p>

    <h2>2. คาเฟ่ย่านทองหล่อ</h2>
    <p>ร้านกาแฟสไตล์มินิมอล มุมถ่ายรูปสวย</p>

</body>

</html>
